[project]
name = "muscle-power"
version = "0.1.0"
description = "Callibri EMG sensor real-time muscle power visualiser"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
    "pyneurosdk2>=1.0.0",
    "bleak>=0.22.0",
]

[project.optional-dependencies]
kb = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]
desktop = [
    "PyQt6>=6.6.0",
    "pyqtgraph>=0.13.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muscle_power", "src/muscle_power_desktop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
